name: CI

# The gates here are the same `make` targets you run locally — `make lint`,
# `make test`, `make smoke`. Nothing is re-implemented in YAML, so a green
# pipeline and a green workstation can never disagree about what "passing"
# means. If a step below looks like a shell rewrite of a Makefile target, that
# is the bug: change the Makefile and call it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A branch that is being force-pushed does not need its previous run finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than floating so a toolchain release cannot turn the build
  # red without a commit in this repository.
  GO_VERSION: "1.25"

jobs:
  # Split into three parallel jobs so a formatting nit reports itself in
  # seconds instead of waiting behind the race-detector suite.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -count=1 defeats the test cache, so "green" always means the tests
      # actually ran on this commit.
      - name: go test -race ./...
        run: make test

      - name: Coverage
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 20

      # The suite is deliberately about goroutine hygiene (`make leak`), so the
      # reported coverage is a byproduct, not a gate. It is uploaded only as a
      # CI artefact — no third-party coverage service, which keeps the
      # "no external dependencies" claim honest.
      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  docker:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `make smoke` builds the demo, starts it, and probes /healthz and /stats.
      # It proves the binary boots and serves, not merely that it links.
      - name: Build and probe dispatchd
        run: make smoke

      - name: Build container image
        run: docker build --build-arg GO_VERSION=${GO_VERSION} -t go-dispatch:ci .
